<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Study-OS</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav>
      <h1>StudyOS</h1>
    </nav>
    <div class="container">
      <aside>
        <h2>MENU</h2>
        <ul>
          <li>Dashboard</li>
          <li>Tasks</li>
          <li>Subjects</li>
          <li>Notes</li>
          <li>Progress</li>
        </ul>
      </aside>
      <main>
        <h2>Today's Tasks</h2>
        <div class="task-input">
          <input type="text" class="input" />
          <button class="addbtn">Add Task</button>
        </div>
        <ul class="task-list"></ul>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
